name: CI

# 플랫폼별 확인을 사람 손에서 떼어 낸다. Windows·macOS·Linux 모두에서
# 1) 포맷·clippy·테스트(fixtures sha 결정성 포함), 2) 릴리스 빌드(설치 파일 포함) + 앱 자동 확인(scripts/check-app.sh)을
# 돌리고, 확인을 통과한 설치 파일을 실행 결과(Artifacts)에 올린다(사람이 내려받아 화면을 확인한다).
# 3) `v<버전>` 태그를 밀면 같은 설치 파일로 GitHub 릴리스 초안을 만든다(사람이 보고 게시한다).
# 화면을 봐야 하는 확인(창 포커스, 닫기 = 숨기기, 트레이)은 여기서 하지 못한다.

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches: [main]
    # 태그에는 경로 필터가 적용되지 않는다(문서만 바꾼 커밋에 단 태그도 돈다).
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

# 같은 브랜치에 새 푸시가 오면 이전 실행을 취소한다(Windows·macOS 러너 사용 시간을 아낀다).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  check:
    name: 검사 (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04 }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Linux 시스템 라이브러리
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev shellcheck

      # package.json의 volta.node 버전을 쓴다.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      # rust-toolchain.toml의 버전을 rustup이 설치한다.
      - name: Rust 툴체인
        run: cargo --version && rustc --version

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: 프런트 타입 검사·빌드
        run: npm run build

      - name: 프런트 단위 테스트
        if: runner.os == 'Linux'
        run: npm test

      - name: 포맷
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # 릴리스 태그는 앱 버전(Cargo·npm·tauri.conf.json, 모두 같아야 한다)과 같아야 한다. 설치 파일 이름이 이 버전이다.
      - name: 앱 버전 (릴리스 태그)
        if: runner.os == 'Linux' && github.ref_type == 'tag'
        run: node scripts/check-version.mjs "$GITHUB_REF_NAME"

      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck bench/*.sh fixtures/*.sh scripts/*.sh

      # macOS 기본 bash 3.2는 `$dir가`처럼 변수 바로 뒤에 붙은 한글 바이트까지 변수 이름으로 읽는다(unbound variable).
      # shellcheck는 잡지 못한다. 변수 뒤에 ASCII가 아닌 글자가 오면 `${dir}가`처럼 감싼다.
      - name: bash 3.2 호환 (변수 뒤 한글)
        if: runner.os == 'Linux'
        run: |
          if grep -nP '\$[A-Za-z_][A-Za-z0-9_]*[^\x00-\x7F]' bench/*.sh fixtures/*.sh scripts/*.sh; then
            echo "::error::변수 바로 뒤에 ASCII가 아닌 글자가 있다. \${이름}처럼 감싼다(macOS bash 3.2)."
            exit 1
          fi

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 테스트 바이너리 하나가 실패해도 나머지를 돌린다(실패한 플랫폼의 다른 실패를 한 번에 본다).
      - name: 테스트
        run: cargo test --workspace --no-fail-fast
        env:
          # macOS는 기본 bash 3.2로 fixtures 스크립트를 돌려 호환성을 함께 확인한다.
          PLX_BASH: ${{ runner.os == 'macOS' && '/bin/bash' || '' }}

  app:
    name: 앱 확인 (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        # bundles: 만들 설치 파일. macOS의 app은 shim이 가리킬 앱 번들(.app)이고 DMG가 그것을 담는다.
        include:
          - { name: Linux, os: ubuntu-24.04, bundles: deb }
          - { name: Windows, os: windows-latest, bundles: nsis }
          - { name: macOS, os: macos-latest, bundles: "app,dmg" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      # 앱 확인은 이 저장소의 이력으로 blame·캐시를 본다. 얕은 클론(기본 깊이 1)은 결과를 캐시하지 않는다.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Linux 시스템 라이브러리
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev xvfb dbus

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Rust 툴체인
        run: cargo --version && rustc --version

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # 실행 파일과 설치 파일을 만든다. 앱 확인은 target/release의 실행 파일(macOS는 .app 번들)로 한다.
      - name: 릴리스 빌드
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      # 릴리스 빌드가 모은 오픈 소스 라이선스 고지(scripts/third-party-notices.mjs)가 실행 파일에 묻힐 dist에 있다.
      - name: 오픈 소스 라이선스 고지
        run: |
          f=dist/third-party-notices.txt
          test -s "$f"
          grep -q '^Rust tauri 2\.' "$f"
          grep -q '^npm react ' "$f"
          head -4 "$f"

      - name: 앱 확인 (Linux, 가상 화면)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          NO_AT_BRIDGE: 1
        run: dbus-run-session -- xvfb-run -a scripts/check-app.sh

      - name: 앱 확인 (Windows, Git Bash)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: scripts/check-app.sh

      # 사용자가 쓰는 경로 그대로: shim 설치 → shim으로 실행. 스크립트는 기본 bash 3.2로 돌린다.
      - name: 앱 확인 (macOS, shim 경유)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          /bin/bash scripts/install-macos-shim.sh target/release/bundle/macos/parallax.app "$RUNNER_TEMP/bin"
          /bin/bash scripts/check-app.sh "$RUNNER_TEMP/bin/plx"

      # 확인을 통과한 설치 파일을 실행 결과에 올린다. 사람이 내려받아 화면을 확인하고(docs/MANUAL_CHECKS.md),
      # 태그 빌드에서는 release 작업이 릴리스 초안에 붙인다. 파일마다 압축하지 않고 올려 내려받으면 그 파일이 그대로 온다.
      - name: 설치 파일 모으기
        id: dist
        run: scripts/collect-dist.sh "$RUNNER_TEMP/dist"

      - name: 설치 파일 올리기
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.dist.outputs.installer }}
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 14

      - name: 설치 없이 쓰는 파일 올리기 (Windows)
        if: steps.dist.outputs.portable != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.dist.outputs.portable }}
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  # `v<버전>` 태그: 세 플랫폼의 확인을 통과한 설치 파일로 릴리스 초안을 만든다(scripts/draft-release.sh).
  # 초안은 공개되지 않는다. 사람이 GitHub의 Releases에서 보고 게시한다.
  release:
    name: 릴리스 초안
    if: github.ref_type == 'tag'
    needs: app
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # 실행 결과마다 이름(= 파일 이름)의 디렉터리에 받는다. 설치 파일 가운데 zip이 있어 풀지 않는다.
      - uses: actions/download-artifact@v8
        with:
          pattern: parallax_*
          path: ${{ runner.temp }}/artifacts
          skip-decompress: true

      - name: 릴리스 초안 만들기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/draft-release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/artifacts"
